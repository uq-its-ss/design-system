name: Publish NPM

on:
  push:
    branches:
      - master
      - releases
  pull_request:
    branches:
      - releases
    types: [opened, synchronize, reopened]

concurrency:
  # Ensures only one publish for a given branch runs at a time. A second push
  # queues behind the current run rather than cancelling it, since cancelling
  # a `lerna publish` mid-flight can leave git and npm in an inconsistent state.
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Job 1: Create draft release when PR to releases is opened
  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'releases' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "⬇️ Checkout repo"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}

      - name: "⎔ Setup node 24"
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: "📦️ Install dependencies"
        run: npm ci

      - name: "🔢 Calculate package version bumps"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          node scripts/build-package-version-table.js > package-versions.md

      - name: "📝 Generate draft changelog"
        id: changelog
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Get changed packages
          npx lerna changed --json > changed.json || echo "[]" > changed.json

          # Anchor the changelog range to the most recent dedicated release tag
          # (created by this workflow), NOT `git describe --tags`. This repo tags
          # every package version independently, and the release commit itself
          # carries dozens of those tags - so `git describe --tags --abbrev=0`
          # can resolve to a tag pointing at HEAD, producing an empty (and
          # therefore silently useless) commit range. Falling back to the PR's
          # base commit on `releases` handles the first-ever run, when no
          # `release-*` tag exists yet.
          BASE_REF="$(git tag --list 'release-*' --sort=-creatordate | head -1)"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="$PR_BASE_SHA"
            echo "No release-* tag found (first release) - using PR base commit $BASE_REF as changelog anchor"
          else
            echo "Using most recent release tag as changelog anchor: $BASE_REF"
          fi
          export BASE_REF

          # Generate changelog from conventional commits
          cat > generate-draft.js << 'SCRIPT'
          const { execSync } = require('child_process');
          const fs = require('fs');
          
          // Get commits since last release
          try {
            const recordSep = '\x1e';
            const fieldSep = '\x1f';
            const baseRef = process.env.BASE_REF;
            const commitsRaw = execSync(
              `git log --pretty=format:"%H%x1f%s%x1f%b%x1e" ${baseRef}..HEAD`,
              { encoding: 'utf8' }
            );
            
            const features = [];
            const fixes = [];
            const breaking = [];
            
            commitsRaw
              .split(recordSep)
              .filter(Boolean)
              .forEach((record) => {
                const cleanRecord = record.trim();
                if (!cleanRecord) return;

                const [hash, subject, body = ''] = cleanRecord.split(fieldSep);
                const shortHash = hash.substring(0, 7);
                
                if (subject.startsWith('feat!:') || (subject.startsWith('feat(') && subject.includes('!:')) || body.includes('BREAKING CHANGE')) {
                  breaking.push(`- ${subject.replace(/^feat!?(\([^)]+\))?:\s*/, '**$1**: ')} (${shortHash})`);
                } else if (subject.startsWith('feat')) {
                  features.push(`- ${subject.replace(/^feat(\([^)]+\))?:\s*/, '**$1**: ')} (${shortHash})`);
                } else if (subject.startsWith('fix')) {
                  fixes.push(`- ${subject.replace(/^fix(\([^)]+\))?:\s*/, '**$1**: ')} (${shortHash})`);
                }
              });
            
            let changelog = '<!-- Add your manual summary here -->\n\n';
            changelog += '---\n\n';
            
            if (breaking.length > 0) {
              changelog += '## 💥 Breaking Changes\n\n' + breaking.join('\n') + '\n\n';
            }
            if (features.length > 0) {
              changelog += '## 🚀 Features\n\n' + features.join('\n') + '\n\n';
            }
            if (fixes.length > 0) {
              changelog += '## 🐛 Bug Fixes\n\n' + fixes.join('\n') + '\n\n';
            }
            
            changelog += '**This release includes updates to the following packages:**\n\n';
            changelog += '<!-- PACKAGE_VERSIONS_START -->\n';
            changelog += fs.readFileSync('package-versions.md', 'utf8').trim() + '\n';
            changelog += '<!-- PACKAGE_VERSIONS_END -->\n\n';
            
            console.log(changelog);
          } catch (error) {
            console.log('<!-- Add your manual summary and changelog here -->');
          }
          SCRIPT
          
          node generate-draft.js > draft-changelog.md
          
          # Output for next step
          echo "DRAFT_CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat draft-changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "📅 Generate release tag"
        id: release-tag
        run: |
          RELEASE_DATE=$(date +%Y-%m-%d)
          RELEASE_TAG="release-${RELEASE_DATE}"
          
          # Check if tag exists, append .2, .3, etc.
          COUNTER=2
          ORIGINAL_TAG="$RELEASE_TAG"
          while git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; do
            RELEASE_TAG="${ORIGINAL_TAG}.${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done
          
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "title=Release: ${RELEASE_DATE}$([ "$RELEASE_TAG" != "$ORIGINAL_TAG" ] && echo ".$(echo $RELEASE_TAG | grep -oE '[0-9]+$')" || echo '')" >> $GITHUB_OUTPUT

      - name: "🎉 Create draft release"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release-tag.outputs.title }}
          DRAFT_CHANGELOG: ${{ steps.changelog.outputs.DRAFT_CHANGELOG }}
        with:
          github-token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          script: |
            // Read via process.env rather than interpolating GitHub expressions directly
            // into this script. The changelog is built from commit subjects/
            // bodies, which are attacker-controlled; interpolating it straight
            // into the script source would let a backtick or ${...} in a commit
            // message break out of the string and execute arbitrary JS with
            // this step's GITHUB_TOKEN (UQDS_PERSONAL_ACCESS_TOKEN).
            const tag = process.env.RELEASE_TAG;
            const title = process.env.RELEASE_TITLE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const changelog = process.env.DRAFT_CHANGELOG;

            // The draft release's identity (its numeric ID) is tracked in a
            // dedicated PR comment, NOT in the release body or via a
            // recomputed tag_name. The release body is explicitly a
            // human-editable field (see ADR 0002 "Human adds summary") where
            // reviewers add highlights/migration notes during curation - a
            // hidden marker placed there can be stripped, causing the merge
            // lookup below to miss the real draft and create a near-empty
            // duplicate. A PR comment is never part of that editing workflow,
            // so it's a safe place to persist this association.
            const idMarkerPrefix = '<!-- RELEASE_DRAFT_ID: ';
            const buildMarker = (id) => `${idMarkerPrefix}${id} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const trackingComment = comments.find(c => c.body && c.body.includes(idMarkerPrefix));

            let existingDraft = null;
            if (trackingComment) {
              const idMatch = trackingComment.body.match(/<!-- RELEASE_DRAFT_ID: (\d+) -->/);
              if (idMatch) {
                try {
                  const { data: release } = await github.rest.repos.getRelease({
                    owner,
                    repo,
                    release_id: Number(idMatch[1]),
                  });
                  if (release.draft) {
                    existingDraft = release;
                  } else {
                    console.log(`Release ${idMatch[1]} referenced by the tracking comment is no longer a draft - treating as not found.`);
                  }
                } catch (error) {
                  console.log(`Tracking comment references release ${idMatch[1]}, but it could not be found (${error.message}). A new draft will be created.`);
                }
              }
            }

            if (existingDraft) {
              console.log(`Draft release already exists: ${existingDraft.html_url}`);
              const body = `📝 **Draft release already exists**\n\n[Edit draft release](${existingDraft.html_url})\n\nAdd your summary, highlights, and migration notes before approving the release.\n\n${buildMarker(existingDraft.id)}`;
              if (trackingComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: trackingComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } else {
              const { data: draft } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: title,
                body: changelog,
                draft: true,
                prerelease: false
              });

              console.log(`Draft release created: ${draft.html_url}`);

              const body = `🎉 **Draft release created**\n\n[Edit draft release](${draft.html_url})\n\n**Next steps:**\n1. Edit the draft release to add:\n   - Summary of what changed\n   - Highlights\n   - Breaking changes with migration notes (if any)\n2. Save the draft (do not publish yet)\n3. Approve this PR when ready to release\n\nThe draft will be automatically published when this PR is merged.\n\n${buildMarker(draft.id)}`;
              if (trackingComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: trackingComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

  # Job 2: Publish packages (existing workflow)
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # This condition prevents the workflow running FOR the Lerna publish commit itself
    if: ${{ github.event_name == 'push' && ! startsWith(github.event.head_commit.message, 'chore(release)') }}
    permissions:
      id-token: write       # Required for OIDC authentication with NPM
      contents: write       # Required for git operations (tags, commits)
      pull-requests: read   # Required to read the PR comment tracking the draft release ID
    steps:
      - name: "⬇️ Checkout repo"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important to fetch all history and tags
          token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }} # Use PAT to allow pushing tags/commits later

      - name: "⎔ Setup node 24"
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: "📦️ Install dependencies"
        run: npm ci

      # --- Steps for 'releases' branch ---

      - name: "🔎 Locate draft release for this merge"
        if: ${{ github.ref_name == 'releases' }}
        id: find-draft
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          script: |
            // Identify the draft created for the merged PR via the tracking
            // PR comment left by "🎉 Create draft release", not by a
            // recomputed date-based tag or a marker in the release body. The
            // release body is explicitly a human-editable field (ADR 0002:
            // "Human adds summary") that curators rewrite before approval, so
            // a marker placed there could be stripped and cause this lookup
            // to miss the real draft and create a near-empty duplicate on
            // publish. The tracking comment is never part of that editing
            // workflow, so its hidden release-ID marker is a stable anchor.
            // Extract the PR number from the merge commit message, supporting
            // both merge commits ("Merge pull request #N") and squash commits
            // ("... (#N)").
            const commitMessage = ${{ toJSON(github.event.head_commit.message) }};
            const match = commitMessage.match(/Merge pull request #(\d+)/) || commitMessage.match(/\(#(\d+)\)/);

            if (!match) {
              core.warning(`Could not determine PR number from merge commit message: "${commitMessage}". Falling back to creating a fresh release at publish time.`);
              core.setOutput('found', 'false');
              return;
            }

            const prNumber = Number(match[1]);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const idMarkerPrefix = '<!-- RELEASE_DRAFT_ID: ';
            const trackingComment = comments.find(c => c.body && c.body.includes(idMarkerPrefix));

            if (!trackingComment) {
              core.warning(`No tracking comment with a draft release ID found on PR #${prNumber}. Falling back to creating a fresh release at publish time.`);
              core.setOutput('found', 'false');
              return;
            }

            const idMatch = trackingComment.body.match(/<!-- RELEASE_DRAFT_ID: (\d+) -->/);
            if (!idMatch) {
              core.warning(`Tracking comment on PR #${prNumber} did not contain a parseable release ID. Falling back to creating a fresh release at publish time.`);
              core.setOutput('found', 'false');
              return;
            }

            let draft;
            try {
              const { data } = await github.rest.repos.getRelease({
                owner,
                repo,
                release_id: Number(idMatch[1]),
              });
              draft = data;
            } catch (error) {
              core.warning(`Tracking comment on PR #${prNumber} references release ${idMatch[1]}, which could not be found (${error.message}). Falling back to creating a fresh release at publish time.`);
              core.setOutput('found', 'false');
              return;
            }

            if (!draft.draft) {
              core.warning(`Release ${draft.id} referenced by PR #${prNumber}'s tracking comment is no longer a draft (may already be published). Falling back to creating a fresh release at publish time.`);
              core.setOutput('found', 'false');
              return;
            }

            core.setOutput('found', 'true');
            core.setOutput('draft_id', String(draft.id));
            core.setOutput('draft_tag', draft.tag_name);
            console.log(`Located draft release for PR #${prNumber}: ${draft.html_url} (tag: ${draft.tag_name}, id: ${draft.id})`);

      - name: "🧐 Version dry run"
        if: ${{ github.ref_name == 'releases' }}
        id: dry-run
        env:
          GH_TOKEN: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          # Dry run for version bump ONLY, no tag/push yet.
          # Failure is captured (not hidden) and surfaced prominently in the
          # approval issue below, so a human sees it and can deny the release
          # rather than approving against stale/blank version info.
          set +e
          npx lerna version --conventional-commits --conventional-graduate --yes --no-git-tag-version --no-push > dry-run-output.log 2>&1
          DRY_RUN_EXIT=$?
          set -e

          cat dry-run-output.log

          if [ $DRY_RUN_EXIT -eq 0 ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "failed=false" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED (exit code $DRY_RUN_EXIT)" >> $GITHUB_OUTPUT
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

          echo "output<<DRYRUN_EOF" >> $GITHUB_OUTPUT
          cat dry-run-output.log >> $GITHUB_OUTPUT
          echo "DRYRUN_EOF" >> $GITHUB_OUTPUT

      - name: "📅 Prepare release info"
        if: ${{ github.ref_name == 'releases' }}
        id: release-info
        run: |
          RELEASE_DATE=$(date +%Y-%m-%d)

          if [ "${{ steps.find-draft.outputs.found }}" = "true" ]; then
            # Reuse the exact tag the draft was created with, so the git tag we
            # push and the release we publish always refer to the same object -
            # never recompute this independently at publish time.
            RELEASE_TAG="${{ steps.find-draft.outputs.draft_tag }}"
            echo "Using tag from located draft release: $RELEASE_TAG"
          else
            RELEASE_TAG="release-${RELEASE_DATE}"

            # Check if tag exists, append .2, .3, etc.
            COUNTER=2
            ORIGINAL_TAG="$RELEASE_TAG"
            while git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; do
              RELEASE_TAG="${ORIGINAL_TAG}.${COUNTER}"
              COUNTER=$((COUNTER + 1))
            done
            echo "No draft release located - generated a new tag: $RELEASE_TAG"
          fi
          
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: "🔢 Refresh package versions in draft release"
        if: ${{ github.ref_name == 'releases' }}
        id: package-versions
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          node scripts/build-package-version-table.js > package-versions.md
          echo "PACKAGE_VERSIONS<<EOF" >> $GITHUB_OUTPUT
          cat package-versions.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "📝 Update draft release with final versions"
        if: ${{ github.ref_name == 'releases' && steps.find-draft.outputs.found == 'true' }}
        uses: actions/github-script@v7
        env:
          DRAFT_ID: ${{ steps.find-draft.outputs.draft_id }}
          PACKAGE_VERSIONS: ${{ steps.package-versions.outputs.PACKAGE_VERSIONS }}
        with:
          github-token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          script: |
            // Read via process.env rather than interpolating GitHub expressions directly
            // into this script. PACKAGE_VERSIONS is derived from published
            // package names/versions, which could contain backticks or
            // template-literal placeholders; interpolating it straight into the script
            // source would let that break out and execute arbitrary JS with
            // this step's GITHUB_TOKEN (UQDS_PERSONAL_ACCESS_TOKEN).
            const draftId = process.env.DRAFT_ID;
            const packageVersions = process.env.PACKAGE_VERSIONS;

            const { data: draft } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draftId,
            });

            const startMarker = '<!-- PACKAGE_VERSIONS_START -->';
            const endMarker = '<!-- PACKAGE_VERSIONS_END -->';
            const markerBlock = `${startMarker}\n${packageVersions}\n${endMarker}`;

            let body = draft.body || '';
            if (body.includes(startMarker) && body.includes(endMarker)) {
              const pattern = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);
              body = body.replace(pattern, markerBlock);
            } else {
              console.log('Draft release body is missing version markers (may have been edited away) - appending version list instead.');
              body = `${body}\n\n**Package versions:**\n\n${markerBlock}`;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draftId,
              body,
            });

            console.log(`Updated draft release ${draft.html_url} with final package versions.`);

      - name: "⌛️ Wait for approval"
        uses: trstringer/manual-approval@v1
        if: ${{ github.ref_name == 'releases' }}
        with:
          secret: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          approvers: uqds-admin
          minimum-approvals: 1
          issue-title: >-
            ${{ steps.dry-run.outputs.failed == 'true' && '⚠️ DRY RUN FAILED — Approve new release ✅' || 'Approve new release ✅' }}
          issue-body: |
            Please approve or deny the release.
            
            **Release tag:** `${{ steps.release-info.outputs.tag }}`
            
            **Dry run status:** ${{ steps.dry-run.outputs.status }}
            
            ${{ steps.dry-run.outputs.failed == 'true' && '**⚠️ WARNING: The version dry run failed. Do not approve until this is investigated — the version/changelog info below may be incomplete or wrong.**' || '' }}
            
            <details>
            <summary>Dry run output</summary>
            
            ```
            ${{ steps.dry-run.outputs.output }}
            ```
            
            </details>
            
            **Next steps after approval:**
            1. Packages will be published to npm with `@latest` tag
            2. Draft GitHub Release will be published
            3. Root CHANGELOG.md will be auto-generated
            
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            to confirm the version is as expected.
            
          exclude-workflow-initiator-as-approver: false

      - name: "✨ Publish stable"
        if: ${{ github.ref_name == 'releases' }}
        env:
          GH_TOKEN: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
        run: |
          # Ensure clean state before publish, especially after dry run
          git reset --hard HEAD
          git clean -fd
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          # Publish: bumps version, creates tag vx.y.z, commits, pushes commit/tag, publishes to npm
          npx lerna publish --conventional-commits --conventional-graduate --yes

      - name: "🏷️ Create release tag"
        if: ${{ github.ref_name == 'releases' }}
        env:
          GH_TOKEN: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release-info.outputs.tag }}"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "Created and pushed tag: $RELEASE_TAG"

      - name: "📝 Publish GitHub Release"
        if: ${{ github.ref_name == 'releases' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          script: |
            const found = '${{ steps.find-draft.outputs.found }}' === 'true';
            const draftId = '${{ steps.find-draft.outputs.draft_id }}';

            if (found) {
              // Publish the existing draft located earlier in this job - avoids
              // re-searching by tag_name, which is what previously went wrong.
              const { data: published } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftId,
                draft: false
              });
              console.log(`Published draft release: ${published.html_url}`);
            } else {
              console.log('No draft release located earlier in this job - creating new release with auto-generated changelog');
              // Fallback: create new release if draft doesn't exist
              const { data: newRelease } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: '${{ steps.release-info.outputs.tag }}',
                name: 'Release: ${{ steps.release-info.outputs.date }}',
                body: '<!-- Auto-generated release - draft was not found -->\n\nSee per-package CHANGELOGs for details.',
                draft: false,
                prerelease: false
              });
              console.log(`Created new release: ${newRelease.html_url}`);
            }

      - name: "📄 Generate root CHANGELOG.md"
        if: ${{ github.ref_name == 'releases' }}
        env:
          GH_TOKEN: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
          EXPECTED_RELEASE_TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          # Generate CHANGELOG.md from all GitHub Releases. EXPECTED_RELEASE_TAG
          # tells the script which release it must see before trusting the API
          # response - the release/tag we just published above - so it retries
          # past any read-after-write lag instead of silently regenerating
          # CHANGELOG.md from a stale list that's missing this release.
          node scripts/generate-changelog.js
          
          # Commit and push if changed
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md unchanged"
          else
            git commit -m "docs: update CHANGELOG.md from releases"
            git push origin releases
            echo "CHANGELOG.md updated and pushed"
          fi

      # --- Steps for 'master' branch ---
      
      - name: "🐣 Publish alpha"
        if: ${{ github.ref_name == 'master' }}
        env:
          GH_TOKEN: ${{ secrets.UQDS_PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          # Publish alpha: bumps version, creates tag vx.y.z-alpha.N, commits, pushes commit/tag, publishes to npm
          npx lerna publish --conventional-commits --conventional-prerelease --dist-tag alpha --yes